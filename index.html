<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndexedDB v1 → v5 迁移演示</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .container { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef9c3; color: #854d0e; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    button {
      padding: 7px 14px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #f9fafb; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.primary:hover:not(:disabled) { background: #1d4ed8; }
    button.danger { color: #b91c1c; border-color: #fca5a5; }
    .options { display: flex; gap: 18px; font-size: 13px; color: #374151; }
    .options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    #progressCanvas { width: 100%; height: 120px; display: block; }
    #status {
      font-size: 13px;
      color: #374151;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
    }
    #log {
      height: 260px;
      overflow-y: auto;
      margin: 0;
      padding: 10px;
      font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #111827;
      color: #d1fae5;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    h2 { font-size: 14px; margin: 0 0 10px; color: #374151; }
  </style>
</head>
<body>
  <div class="container">
    <h1>IndexedDB v1 → v5 迁移演示<span id="modeBadge" class="badge ok">IndexedDB 持久化模式</span></h1>
    <div class="sub">Web Worker 执行迁移 · Canvas 可视化进度 · 断点续跑 / 失败回滚 / 占用提示 / 隐私模式降级</div>

    <div class="card">
      <h2>操作</h2>
      <div class="controls">
        <button id="btnSeed">① 生成 v1 旧数据</button>
        <button id="btnMigrate" class="primary">② 迁移到 v5</button>
        <button id="btnInterrupt" class="danger">模拟中断</button>
        <button id="btnHold">模拟占用</button>
        <button id="btnRelease">释放占用</button>
        <button id="btnRollback">演示版本回退</button>
        <button id="btnReset" class="danger">重置数据库</button>
      </div>
      <div class="options">
        <label><input type="checkbox" id="chkFail"> 注入失败（演示回滚）</label>
        <label><input type="checkbox" id="chkMemory"> 强制内存模式（模拟隐私模式）</label>
      </div>
      <div id="status">就绪 —— 请先「生成 v1 旧数据」，再「迁移到 v5」</div>
    </div>

    <div class="card">
      <h2>迁移进度（Canvas）</h2>
      <canvas id="progressCanvas"></canvas>
    </div>

    <div class="card">
      <h2>运行日志</h2>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="migrations.js"></script>
  <script src="main.js"></script>
</body>
</html>
